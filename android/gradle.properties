# Mémoire dimensionnée pour cette machine (7,9 Go de RAM). L'ancienne valeur
# (-Xmx8G + MaxMetaspaceSize 4G) faisait swapper la JVM Gradle : le build
# « assembleDebug » restait alors des minutes sans écrire le moindre fichier.
# 2 Go de heap suffisent pour ce module (Dart compile + 5 plugins Flutter).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Le daemon Kotlin possède son propre heap : on le borne aussi.
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true

# compileSdk = 37 est utilisé par l'app (et par le plugin flutter_secure_storage).
# AGP 9.0.1 est validé jusqu'à l'API 36 : ce drapeau évite l'avertissement associé
# (« We recommend using a newer Android Gradle plugin to use compileSdk = 37 »).
android.suppressUnsupportedCompileSdk=37
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
